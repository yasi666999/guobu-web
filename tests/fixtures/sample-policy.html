  <h1>广东省2026年家电以旧换新实施细则</h1>
  <p>发布机关：广东省商务厅</p>
  <p>为促进消费品以旧换新，对个人消费者购买一级能效冰箱、洗衣机、空调等家电给予补贴。</p>
  <p>补贴资金由中央财政和超长期特别国债资金安排。</p>
  <p>补贴标准为按销售价格的15%给予补贴，最高不超过1000元。</p>
  <p>本细则自2026年4月1日起施行，有效期至2026年12月31日。</p>
  <p>申领条件：消费者须实名购买并保留发票，每位消费者每类产品可补贴1件。</p>
